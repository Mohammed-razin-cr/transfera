<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5d5"/>
      <stop offset="50%" style="stop-color:#b41e1e"/>
      <stop offset="100%" style="stop-color:#500a0a"/>
    </linearGradient>
  </defs>
  <!-- Dark premium background -->
  <rect width="100" height="100" rx="24" fill="#0a0808"/>
  <!-- Thin glow border -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="none" stroke="url(#glow)" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Shield shape -->
  <path d="M50 25 C60 25 70 20 72 32 C72 50 62 65 50 75 C38 65 28 50 28 32 C30 20 40 25 50 25 Z" 
        fill="none" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small spark/glow in the center -->
  <circle cx="50" cy="48" r="7" fill="url(#glow)"/>
</svg>
