services:
  gateway:
    build:
      context: .
    image: transfera-gateway:local
    pull_policy: build
    container_name: transfera-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      TRANSFERA_ALLOWED_ORIGINS: "http://localhost:8088,http://127.0.0.1:8088"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Optional. Polls ghcr.io every 5 min and auto-pulls + restarts any container
  # with the watchtower.enable=true label. Start it with the "updates" profile.
  watchtower:
    profiles: ["updates"]
    image: containrrr/watchtower
    container_name: transfera-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.40"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
